name: Release Hey Woo

# Produce the distributable Hey Woo plugin zip from plugins/hey-woo and publish
# it as a GitHub Release.
#
# Trigger: manual workflow_dispatch only. Hey Woo has its own version and tag
# namespace so it can release independently from WooCommerce for Claude while
# staying in this monorepo.
#
# Prerequisites:
#   - The `version` input must match the `Version:` header in
#     plugins/hey-woo/hey-woo.php.
#   - The tag `hey-woo-v<version>` must not already exist on the remote.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.4.2 (must match plugins/hey-woo/hey-woo.php)'
        required: true
        type: string
      draft:
        description: 'Create the Release as a draft (review/edit before publishing)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the Release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write # required for softprops/action-gh-release to create the tag + Release

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate version input matches Hey Woo plugin header
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          INPUT_VERSION="${INPUT_VERSION#v}"

          PLUGIN_FILE="plugins/hey-woo/hey-woo.php"
          HEADER_VERSION="$(awk '/^ \* Version:/ { print $3; exit }' "${PLUGIN_FILE}")"
          if [[ -z "${HEADER_VERSION}" ]]; then
            echo "ERROR: could not read Version header from ${PLUGIN_FILE}" >&2
            exit 1
          fi

          if [[ "${INPUT_VERSION}" != "${HEADER_VERSION}" ]]; then
            echo "ERROR: input version '${INPUT_VERSION}' does not match ${PLUGIN_FILE}'s Version header ('${HEADER_VERSION}')." >&2
            echo "       Bump the Hey Woo plugin header on a PR first, merge it, then re-run this workflow." >&2
            exit 1
          fi

          echo "VERSION=${INPUT_VERSION}" >> "$GITHUB_ENV"
          echo "TAG_NAME=hey-woo-v${INPUT_VERSION}" >> "$GITHUB_ENV"

      - name: Verify tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null 2>&1; then
            echo "ERROR: tag ${TAG_NAME} already exists locally in this checkout" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "${TAG_NAME}" > /dev/null 2>&1; then
            echo "ERROR: tag ${TAG_NAME} already exists on origin" >&2
            echo "       Either bump the version or delete the existing tag." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Hey Woo plugin zip
        run: pnpm run hey-woo-plugin-zip

      - name: Verify zip was produced
        run: |
          if [ ! -f hey-woo.zip ]; then
            echo "ERROR: hey-woo.zip not found" >&2
            exit 1
          fi
          unzip -t hey-woo.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hey-woo-${{ env.VERSION }}
          path: hey-woo.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Hey Woo v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: hey-woo.zip
          generate_release_notes: true
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
