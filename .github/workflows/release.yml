name: Release Plugin

# Produce distributable plugin zips and publish them as a GitHub Release.
#
# Trigger: manual workflow_dispatch only — tag pushes do NOT trigger this
# workflow; the tag + Release are CREATED by the workflow, not consumed by it.
# This makes the release a deliberate UI action that goes through the full
# build + validation path.
#
# Prerequisites (enforced at runtime, workflow fails fast if not met):
#   - The `version` input must match the `Version:` header in
#     plugins/woocommerce-for-claude/woocommerce-claude.php. Bump the header
#     on a PR and merge it first, then dispatch this workflow with the matching
#     version.
#   - The tag `v<version>` must not already exist on the remote.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0 (must match the WooCommerce for Claude plugin header)'
        required: true
        type: string
      draft:
        description: 'Create the Release as a draft (review/edit before publishing)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the Release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write # required for softprops/action-gh-release to create the tag + Release

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version input matches plugin header
        run: |
          # Strip an optional leading 'v' so both "0.1.0" and "v0.1.0" are accepted.
          INPUT_VERSION="${{ inputs.version }}"
          INPUT_VERSION="${INPUT_VERSION#v}"

          HEADER_VERSION="$(awk '/^ \* Version:/ { print $3; exit }' plugins/woocommerce-for-claude/woocommerce-claude.php)"
          if [[ -z "${HEADER_VERSION}" ]]; then
            echo "ERROR: could not read Version header from plugins/woocommerce-for-claude/woocommerce-claude.php" >&2
            exit 1
          fi

          if [[ "${INPUT_VERSION}" != "${HEADER_VERSION}" ]]; then
            echo "ERROR: input version '${INPUT_VERSION}' does not match the Version header ('${HEADER_VERSION}')." >&2
            echo "       Bump plugins/woocommerce-for-claude/woocommerce-claude.php on a PR first, merge it, then re-run this workflow." >&2
            exit 1
          fi

          echo "VERSION=${INPUT_VERSION}" >> "$GITHUB_ENV"
          echo "TAG_NAME=v${INPUT_VERSION}" >> "$GITHUB_ENV"

      - name: Verify tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null 2>&1; then
            echo "ERROR: tag ${TAG_NAME} already exists locally in this checkout" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "${TAG_NAME}" > /dev/null 2>&1; then
            echo "ERROR: tag ${TAG_NAME} already exists on origin" >&2
            echo "       Either bump the version or delete the existing tag." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WordPress plugin zip
        run: pnpm run plugin-zip

      - name: Build Claude agent plugin zip
        run: pnpm run agent-plugin-zip

      - name: Verify zips were produced
        run: |
          if [ ! -f woocommerce-for-claude.zip ]; then
            echo "ERROR: woocommerce-for-claude.zip not found" >&2
            exit 1
          fi
          if [ ! -f woocommerce-claude-agent-plugin.zip ]; then
            echo "ERROR: woocommerce-claude-agent-plugin.zip not found" >&2
            exit 1
          fi
          unzip -t woocommerce-for-claude.zip
          unzip -t woocommerce-claude-agent-plugin.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: woocommerce-claude-${{ env.VERSION }}
          path: |
            woocommerce-for-claude.zip
            woocommerce-claude-agent-plugin.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          files: |
            woocommerce-for-claude.zip
            woocommerce-claude-agent-plugin.zip
          generate_release_notes: true
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
