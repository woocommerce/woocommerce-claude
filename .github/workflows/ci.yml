name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/ci.yml'

jobs:
  phpcs:
    name: PHPCS (WordPress + Docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('plugins/woocommerce-for-claude/composer.json', 'plugins/woocommerce-for-claude/composer.lock', 'plugins/hey-woo/composer.json', 'plugins/hey-woo/composer.lock', 'php-packages/*/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        working-directory: plugins/woocommerce-for-claude
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Run PHPCS
        working-directory: plugins/woocommerce-for-claude
        run: composer run phpcs

      - name: Validate Hey Woo Composer metadata
        working-directory: plugins/hey-woo
        run: composer validate --strict

      - name: Run PHPCS for Hey Woo
        run: plugins/woocommerce-for-claude/vendor/bin/phpcs --standard=plugins/woocommerce-for-claude/phpcs.xml.dist --runtime-set text_domain hey-woo plugins/hey-woo/hey-woo.php plugins/hey-woo/includes

      - name: Verify release package contract
        run: ./bin/check-release-contract

  phpunit:
    name: PHPUnit (integration)
    runs-on: ubuntu-latest
    env:
      WP_CORE_DIR: /tmp/wordpress/src
      WP_TESTS_DIR: /tmp/wordpress/tests/phpunit

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Install SVN
        run: sudo apt-get install -y subversion

      - name: Cache Composer
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('plugins/woocommerce-for-claude/composer.json', 'plugins/woocommerce-for-claude/composer.lock', 'plugins/hey-woo/composer.json', 'plugins/hey-woo/composer.lock', 'php-packages/*/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        working-directory: plugins/woocommerce-for-claude
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Install WP test environment
        run: ./bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Run PHPUnit
        working-directory: plugins/woocommerce-for-claude
        run: composer run test-unit
